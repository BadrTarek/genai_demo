[project]
name = "etic-genai"
version = "0.1.0"
description = "Guarded RAG agent and MCP knowledge-base server built with LangChain and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langchain-text-splitters>=1.0",
    # Embeddings use the OpenAI-compatible API (OpenAI or Azure AI Foundry).
    "langchain-openai>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # The MCP server uses the v1 FastMCP API.
    "mcp>=1.0,<2.0",
    "qdrant-client>=1.12",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Chat-model providers other than OpenAI, e.g. `pip install -e ".[anthropic]"`.
openai = ["langchain-openai>=1.0"]
# Streamlit front end (app/streamlit_app.py).
ui = ["streamlit>=1.40", "altair>=5", "pandas>=2"]
anthropic = ["langchain-anthropic>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etic_genai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
